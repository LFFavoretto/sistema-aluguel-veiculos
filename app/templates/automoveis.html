{% extends 'nav.html' %}
{% block conteudo %}

    <h1>Verificar Disponibilidade do Veículo</h1>

    {% if erro %}
        <p style="color:red;">{{ erro }}</p>
    {% endif %}

    {% if status %}
        <p>O veículo <strong>{{ id }}</strong> ({{ veiculo.modelo }}) está: <strong>{{ status }}</strong></p>
    {% endif %}

    <form method="post">
        <label for="id_veiculo">Digite o ID do veículo:</label>
        <input type="text" name="id_veiculo" id="id_veiculo" required>
        <button type="submit">Verificar</button>
    </form>

{% endblock %}
